name: Generate Luffy Clip

# 100% procedural animation: the runner draws every frame from vector math
# (PIL masks + numpy) and encodes it with ffmpeg. No AI models, no downloads.
# Drawings are made at --draw-rate (12/s) and shot at --fps (24/s) => "on twos",
# exactly how hand-drawn anime is filmed.
run-name: "Luffy clip - ${{ inputs.scene }} (${{ inputs.width }}x${{ inputs.height }})"

on:
  workflow_dispatch:
    inputs:
      scene:
        description: Scene to render ('all' stitches every scene into one reel)
        type: choice
        default: all
        options:
          - all
          - gear_second
          - gum_gum_pistol
          - marine_chase
          - sunny_figurehead
          - sunset_silhouette
      resolution:
        description: Frame size
        type: choice
        default: 1280x720
        options:
          - 1280x720
          - 1920x1080
          - 960x540
      supersample:
        description: Geometry oversampling factor (higher = crisper lines, slower)
        type: number
        default: 2
      draw_rate:
        description: Unique drawings per second (12 = anime "on twos")
        type: number
        default: 12
      fps:
        description: Playback frames per second
        type: number
        default: 24
      seconds:
        description: Override scene length in seconds (leave 0 to use each scene's own timing)
        type: number
        default: 0
      seed:
        description: Random seed (FX jitter, sparkles, dust)
        type: number
        default: 42
      gif:
        description: Also write looping GIF previews
        type: boolean
        default: true
      publish_release:
        description: Attach the clips to a GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: luffy-clip
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/base.txt

      - name: Environment
        run: |
          python --version
          python -c "import PIL, numpy; print('pillow', PIL.__version__, '| numpy', numpy.__version__)"
          python -c "import imageio_ffmpeg; print('bundled ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: Render the clip
        env:
          SCENE: ${{ inputs.scene }}
          RESOLUTION: ${{ inputs.resolution }}
          SUPERSAMPLE: ${{ inputs.supersample }}
          DRAW_RATE: ${{ inputs.draw_rate }}
          FPS: ${{ inputs.fps }}
          SECONDS: ${{ inputs.seconds }}
          SEED: ${{ inputs.seed }}
          GIF: ${{ inputs.gif }}
        run: |
          set -euo pipefail
          WIDTH="${RESOLUTION%x*}"
          HEIGHT="${RESOLUTION#*x}"
          ARGS=(
            --scene "$SCENE"
            --width "$WIDTH" --height "$HEIGHT"
            --supersample "$SUPERSAMPLE"
            --draw-rate "$DRAW_RATE" --fps "$FPS"
            --seed "$SEED"
            --scale 1
            --out "out/run${{ github.run_number }}"
          )
          if [ "${SECONDS%.*}" -gt 0 ]; then ARGS+=(--seconds "$SECONDS"); fi
          if [ "$GIF" != "true" ]; then ARGS+=(--no-gif); fi
          python -m luffy_clip.cli "${ARGS[@]}"

      - name: Upload clips
        uses: actions/upload-artifact@v7
        with:
          name: luffy-clip-run-${{ github.run_number }}
          path: |
            out/run${{ github.run_number }}/*.mp4
            out/run${{ github.run_number }}/*.gif
            out/run${{ github.run_number }}/manifest.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: clip-${{ github.run_number }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MANIFEST: out/run${{ github.run_number }}/manifest.json
          OUT_DIR: out/run${{ github.run_number }}
        run: |
          set -euo pipefail
          python scripts/make_release_notes.py > RELEASE_NOTES.md
          gh release create "$TAG" \
            --title "Luffy clip #$RUN_NUMBER - ${{ inputs.scene }}" \
            --notes-file RELEASE_NOTES.md \
            "$OUT_DIR"/*.mp4 "$OUT_DIR"/*.gif "$MANIFEST"
