name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          python -m luffy_clip.cli --help
          python -c "from luffy_clip.scenes import scene_names; print(scene_names())"

      - name: Render 3-frame smoke clip
        run: |
          python -m luffy_clip.cli --scene gear_second --seconds 0.25 --draw-rate 12 \
            --width 320 --height 180 --supersample 1 --no-progress --out smoke
          ls -la smoke smoke/*.gif

      - name: Validate workflow files
        run: |
          for file in .github/workflows/*.yml; do
            python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1])); print('ok:', sys.argv[1])" "$file"
          done

      - name: Release-notes renderer smoke test
        run: |
          printf '%s' '{"settings":{"width":1280,"height":720,"draw_rate":12,"fps":24,"seed":1},"scenes":[{"scene":"gear_second","title":"Gear Second burst","drawings":48,"duration_seconds":4.0,"video":{"width":1280,"height":720,"duration_seconds":4.0},"file":"gear_second.mp4"}],"reel":{"file":"luffy_reel.mp4","video":{"width":1280,"height":720,"duration_seconds":4.0},"sha256":"deadbeef","gif":"luffy_reel.gif"}}' \
            | MANIFEST=/dev/stdin GITHUB_REPOSITORY=o/r TAG=clip-1 RUN_NUMBER=1 \
              python scripts/make_release_notes.py
