name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt pyyaml

      - name: Unit tests
        run: python -m pytest -q

      - name: CLI smoke test
        run: |
          python -m luffy_clip.cli --help
          python -c "from luffy_clip.prompts import list_scenes; print(list_scenes())"

      - name: Validate workflow + release-notes scripts
        run: |
          for file in .github/workflows/*.yml; do
            python -c "import sys, yaml; yaml.safe_load(open(sys.argv[1])); print('ok:', sys.argv[1])" "$file"
          done
          MANIFEST=/dev/stdin python scripts/make_release_notes.py <<'JSON' > /dev/null
          {"prompt": "test", "gif": "clip.gif", "backend": "cpu-diffusion", "model": "x", "seed": 1, "video": {"duration_seconds": 2.0}}
          JSON
